    <script>
      // Apply the saved or system theme before first paint to avoid a dark flash.
      (() => {
        let theme = null;
        try {
          theme = localStorage.getItem("theme");
        } catch (error) {}
        if (!theme && window.matchMedia("(prefers-color-scheme: light)").matches) {
          theme = "light";
        }
        if (theme === "light") document.documentElement.setAttribute("data-theme", "light");
      })();

    <script type="module" src="/vendor/model-viewer/model-viewer.min.js"></script>
    <script type="module">
      const catalogResponse = await fetch("/contents/models.json", { cache: "reload" });
      if (!catalogResponse.ok) throw new Error("Failed to fetch /contents/models.json");
      const catalog = await catalogResponse.json();

      const modelEntry = (project, group, entry) => {
        const root = `/assets/art/${project.name.toLowerCase()}`;
        const folder = group.name.toLowerCase();
        const file = encodeURIComponent(entry.model);
        return {
          name: entry.name,
          src: `${root}/${folder}/${file}.glb`,
          thumb: `${root}/thumbs/${folder}/${file}.webp`,
          alt: entry.description
        };
      };

      const projects = (Array.isArray(catalog.projects) ? catalog.projects : []).map((project) => ({
        name: project.name,
        groups: (project.groups || []).map((group) => ({
          name: group.name,
          models: (group.models || []).map((entry) => modelEntry(project, group, entry))
        }))
      }));

      const animationOrder = [
        "Idle",
        "Walk",
        "Run",
        "Jump",
        "Double Jump",
        "Fall",
        "Ground Pound",
        "Flying",
        "Hit",
        "Blast",
        "Swim",
        "Swim Idle",
        "Splash",
        "Whirl",
        "Switch",
        "Dying",
        "Rotate"
      ];

      const viewer = document.getElementById("modelViewer");
      const modelView = document.querySelector(".model-view");
      const animPanel = document.querySelector(".anim-panel:not(.shapes-panel)");
      const shapePanel = document.querySelector(".shapes-panel");
      const projectPicker = document.getElementById("projectPicker");
      const groupPicker = document.getElementById("groupPicker");
      const modelPicker = document.getElementById("modelPicker");
      const animationPicker = document.getElementById("animationPicker");
      const shapePicker = document.getElementById("shapePicker");
      const animTransport = document.getElementById("animTransport");
      const animPlay = document.getElementById("animPlay");
      const animPause = document.getElementById("animPause");
      const animStop = document.getElementById("animStop");
      const animTime = document.getElementById("animTime");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

      const animationLabel = (name) =>
        name.replace(/^_/, "").replace(/([a-z\d])([A-Z])/g, "$1 $2");

      const isTPose = (name) => animationLabel(name).replace(/[\s_-]/g, "").toLowerCase() === "tpose";

      const isIdle = (name) => animationLabel(name) === "Idle";

      const isMove = (name) => animationLabel(name) === "Move";

      const monstersActive = () => currentGroup()?.name === "Monsters";

      const absoluteUrl = (src) => new URL(src, window.location.href).href;

      const targetHeightFraction = 0.5;

      let activeProject = 0;
      let activeGroup = 0;
      let activeModel = 0;

      const currentProject = () => projects[activeProject];
      const currentGroup = () => currentProject().groups[activeGroup];
      const currentModels = () => currentGroup().models;
      let activeAnimation = null;
      let animationChosen = false;
      let requestId = 0;
      let userZoomed = false;
      let framedRadius = null;

      const normalize = (v) => {
        const length = Math.hypot(v.x, v.y, v.z) || 1;
        return { x: v.x / length, y: v.y / length, z: v.z / length };
      };

      const cross = (a, b) => ({
        x: a.y * b.z - a.z * b.y,
        y: a.z * b.x - a.x * b.z,
        z: a.x * b.y - a.y * b.x
      });

      const dot = (a, b) => a.x * b.x + a.y * b.y + a.z * b.z;

      // Share of the viewer height covered by the model's vertical extent.
      const modelHeightFraction = (center, height, orbit, fovRad) => {
        const sinPhi = Math.sin(orbit.phi);
        const camera = {
          x: center.x + orbit.radius * sinPhi * Math.sin(orbit.theta),
          y: center.y + orbit.radius * Math.cos(orbit.phi),
          z: center.z + orbit.radius * sinPhi * Math.cos(orbit.theta)
        };
        const forward = normalize({
          x: center.x - camera.x,
          y: center.y - camera.y,
          z: center.z - camera.z
        });
        const backward = { x: -forward.x, y: -forward.y, z: -forward.z };
        const worldUp = Math.abs(forward.y) > 0.99 ? { x: 0, y: 0, z: 1 } : { x: 0, y: 1, z: 0 };
        const right = normalize(cross(worldUp, backward));
        const up = cross(backward, right);
        const project = (yOffset) => {
          const relative = {
            x: center.x - camera.x,
            y: center.y + yOffset - camera.y,
            z: center.z - camera.z
          };
          const depth = -dot(relative, backward);
          if (depth <= 0) return 0;
          return dot(relative, up) / depth / Math.tan(fovRad / 2);
        };
        return Math.abs(project(height / 2) - project(-height / 2)) / 2;
      };

      // The viewer's saved bounds are the bind pose. Refit them to Idle once that pose is playing.
      const refreshIdleBounds = async (token) => {
        if (!isIdle(viewer.animationName) || viewer.paused || viewer.currentTime <= 0.05) return;
        const scene = sceneOf(viewer);
        const models = scene?.models;
        if (!models?.length) return;
        const parents = models.map((model) => ({ model, parent: model.parent }));
        const point = scene.boundingSphere.center;
        const box = scene.boundingBox;
        let fitted = false;
        try {
          parents.forEach(({ model, parent }) => parent?.remove(model));
          models.forEach((model) => {
            model.updateMatrixWorld(true);
            model.traverse((node) => {
              if (node.isSkinnedMesh && node.skeleton) node.skeleton.update();
            });
          });
          box.makeEmpty();
          models.forEach((model) => {
            model.traverse((node) => {
              if (!node.isMesh) return;
              const position = node.geometry?.attributes?.position;
              if (!position) return;
              for (let index = 0; index < position.count; index += 1) {
                // Skinned positions come back in mesh-local space. The armature
                // scale lives on matrixWorld, which is what the renderer applies.
                node.getVertexPosition(index, point);
                point.applyMatrix4(node.matrixWorld);
                box.expandByPoint(point);
              }
            });
          });
          fitted = !box.isEmpty();
        } finally {
          parents.forEach(({ model, parent }) => {
            if (parent && model.parent !== parent) parent.add(model);
          });
        }
        if (!fitted || token !== requestId) return false;
        box.getSize(scene.size);
        box.getCenter(scene.boundingSphere.center);
        scene.boundingSphere.radius = Math.hypot(scene.size.x, scene.size.y, scene.size.z) / 2;
        const center = scene.boundingSphere.center;
        viewer.cameraTarget = `${center.x}m ${center.y}m ${center.z}m`;
        viewer.minCameraOrbit = "auto auto auto";
        viewer.jumpCameraToGoal();
        await viewer.updateComplete;
        return true;
      };

      // How far the idle bounds reach on screen. 1 is the edge of the view.
      const idleScreenExtent = () => {
        const scene = sceneOf(viewer);
        const camera = scene?.getCamera?.();
        const box = scene?.boundingBox;
        if (!camera || !box || box.isEmpty()) return 0;
        camera.updateMatrixWorld(true);
        scene.target.updateMatrixWorld(true);
        const target = viewer.getCameraTarget();
        const point = box.min.clone();
        let maxAbs = 0;
        for (const x of [box.min.x, box.max.x]) {
          for (const y of [box.min.y, box.max.y]) {
            for (const z of [box.min.z, box.max.z]) {
              point.set(x - target.x, y - target.y, z - target.z).applyMatrix4(scene.target.matrixWorld);
              point.project(camera);
              maxAbs = Math.max(maxAbs, Math.abs(point.x), Math.abs(point.y));
            }
          }
        }
        return maxAbs;
      };

      const frameModel = async (token) => {
        await viewer.updateComplete;
        if (token !== requestId || !viewer.loaded) return;
        const idleFitted = await refreshIdleBounds(token);
        if (token !== requestId) return;
        if (!idleFitted) {
          const scene = sceneOf(viewer);
          viewer.cameraTarget = "auto auto auto";
          viewer.jumpCameraToGoal();
          await viewer.updateComplete;
          if (token !== requestId) return;
          if (scene) {
            await scene.updateFraming();
            if (token !== requestId) return;
            viewer.minCameraOrbit = "auto auto auto";
            await viewer.updateComplete;
            if (token !== requestId) return;
          }
        }
        // Drop the previous model's zoom-out limit before measuring this one.
        viewer.maxCameraOrbit = "auto auto 1000m";
        for (let attempt = 0; attempt < 3; attempt += 1) {
          const dimensions = viewer.getDimensions();
          const center = viewer.getBoundingBoxCenter();
          const orbit = viewer.getCameraOrbit();
          const fov = (viewer.getFieldOfView() * Math.PI) / 180;
          if (!dimensions?.y || !orbit?.radius || !fov) return;
          const fraction = modelHeightFraction(center, dimensions.y, orbit, fov);
          if (!fraction || Math.abs(fraction - targetHeightFraction) < 0.015) break;
          const radius = orbit.radius * (fraction / targetHeightFraction);
          const theta = (orbit.theta * 180) / Math.PI;
          const phi = (orbit.phi * 180) / Math.PI;
          viewer.cameraOrbit = `${theta}deg ${phi}deg ${radius}m`;
          viewer.jumpCameraToGoal();
          await viewer.updateComplete;
          if (token !== requestId) return;
        }
        if (idleFitted) {
          for (let attempt = 0; attempt < 5; attempt += 1) {
            const extent = idleScreenExtent();
            if (!Number.isFinite(extent) || extent <= 0.9) break;
            const orbit = viewer.getCameraOrbit();
            if (!orbit?.radius) break;
            const radius = orbit.radius * (extent / 0.9);
            const theta = (orbit.theta * 180) / Math.PI;
            const phi = (orbit.phi * 180) / Math.PI;
            viewer.cameraOrbit = `${theta}deg ${phi}deg ${radius}m`;
            viewer.jumpCameraToGoal();
            await viewer.updateComplete;
            if (token !== requestId) return;
          }
        }
        // The viewer's far plane is twice the zoom-out limit. That limit has to
        // match the camera's real distance: a closer requested distance is
        // clamped by the minimum orbit, and the old limit then cut off the back
        // of long models.
        const appliedRadius = viewer.getCameraOrbit().radius;
        if (!appliedRadius) return;
        viewer.maxCameraOrbit = `auto auto ${appliedRadius}m`;
        framedRadius = appliedRadius;
      };


      const setPressed = (container, label) => {
        container.querySelectorAll(".model-chip").forEach((button) => {
          button.setAttribute("aria-pressed", String(button.textContent === label));
        });
      };

      const renderMenus = () => {
        renderChips(
          projectPicker,
          projects.map((project, index) => ({ label: project.name, index })),
          currentProject().name,
          (item) => selectProject(item.index),
          true
        );
        renderChips(
          groupPicker,
          currentProject().groups.map((group, index) => ({ label: group.name, index })),
          currentGroup().name,
          (item) => selectGroup(item.index),
          true
        );
      };

      const renderThumbs = (pressedName) => {
        modelPicker.replaceChildren(
          ...currentModels().map((model, index) => {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "model-thumb";
            const selected = model.name === pressedName;
            button.setAttribute("aria-pressed", String(selected));
            button.setAttribute("aria-label", model.name);
            button.disabled = selected;
            const image = document.createElement("img");
            image.src = model.thumb;
            image.alt = "";
            image.width = 168;
            image.height = 168;
            image.decoding = "async";
            button.append(image);
            if (!selected) button.addEventListener("click", () => selectModel(index));
            return button;
          })
        );
      };

      const renderChips = (container, items, pressedLabel, onSelect, lockPressed = false) => {
        container.replaceChildren(
          ...items.map((item) => {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "model-chip";
            button.textContent = item.label;
            const selected = item.label === pressedLabel;
            button.setAttribute("aria-pressed", String(selected));
            if (lockPressed && selected) {
              button.disabled = true;
            } else {
              button.addEventListener("click", () => onSelect(item));
            }
            return button;
          })
        );
      };

      const sortAnimations = (names) =>
        [...names].sort((a, b) => {
          const rank = (name) => {
            if (monstersActive() && isMove(name)) return -1;
            const index = animationOrder.indexOf(animationLabel(name));
            return index === -1 ? animationOrder.length : index;
          };
          return rank(a) - rank(b) || animationLabel(a).localeCompare(animationLabel(b));
        });

      const playAnimation = (name, chosen) => {
        if (!name) return;
        if (chosen) animationChosen = true;
        activeAnimation = name;
        viewer.animationName = name;
        setPressed(animationPicker, animationLabel(name));
        const autoplay = isIdle(name) || (monstersActive() && isMove(name));
        if (reducedMotion.matches && !animationChosen && !autoplay) {
          viewer.pause();
        } else {
          viewer.play();
        }
      };

      const sceneOf = (element) =>
        element[Object.getOwnPropertySymbols(element).find((symbol) => symbol.description === "scene")];

      // The viewer plants its shadow on the lowest vertex. Keep that ground on the model origin.
      const placeGroundAtOrigin = () => {
        const scene = sceneOf(viewer);
        const shadow = scene?.shadow;
        const model = scene?._models?.[0];
        if (!shadow || !model) return;
        shadow.position.y = model.position.y;
        shadow.needsUpdate = true;
      };

      const keepGroundAtOrigin = () => {
        const scene = sceneOf(viewer);
        if (!scene || scene.updateShadow.groundAtOrigin) {
          placeGroundAtOrigin();
          return;
        }
        const updateShadow = scene.updateShadow.bind(scene);
        const wrapped = () => {
          updateShadow();
          placeGroundAtOrigin();
        };
        wrapped.groundAtOrigin = true;
        scene.updateShadow = wrapped;
        placeGroundAtOrigin();
      };

      const applyPlayingPose = () => {
        const scene = sceneOf(viewer);
        scene?.mixers?.forEach((mixer) => {
          if (typeof mixer.setTime === "function") mixer.setTime(Math.max(viewer.currentTime, 0.08));
        });
      };

      const settlePose = async (token) => {
        const fade = viewer.animationCrossfadeDuration;
        viewer.animationCrossfadeDuration = 0;
        showAnimations();
        if (viewer.animationName && !viewer.paused) {
          viewer.currentTime = 0;
          await viewer.updateComplete;
          const started = performance.now();
          while (token === requestId && performance.now() - started < 800) {
            applyPlayingPose();
            await new Promise((resolve) => requestAnimationFrame(resolve));
            if (viewer.currentTime > 0.05) break;
          }
          applyPlayingPose();
          await new Promise((resolve) => requestAnimationFrame(resolve));
        } else {
          await viewer.updateComplete;
        }
        if (token !== requestId) return;
        viewer.animationCrossfadeDuration = fade;
        showShapes();
      };

      const shapeEntries = () => {
        const scene = sceneOf(viewer);
        const grouped = new Map();
        scene?.models?.forEach((model) => {
          model.traverse((node) => {
            const dictionary = node.morphTargetDictionary;
            const influences = node.morphTargetInfluences;
            if (!node.isMesh || !dictionary || !influences) return;
            Object.entries(dictionary).forEach(([name, index]) => {
              if (!grouped.has(name)) grouped.set(name, []);
              grouped.get(name).push({ influences, index });
            });
          });
        });
        return grouped;
      };

      const hideShapes = () => {
        shapePicker.replaceChildren();
        shapePanel.hidden = true;
      };

      const showShapes = () => {
        const shapes = shapeEntries();
        if (!shapes.size) {
          hideShapes();
          return;
        }
        const isMouth = (name) => name.startsWith("Mouth");
        const names = [...shapes.keys()].sort((a, b) => {
          const rank = (name) => (name === "Blink" ? 0 : isMouth(name) ? 2 : 1);
          return rank(a) - rank(b);
        });
        const buttons = new Map();
        const setShape = (name, on) => {
          shapes.get(name).forEach((entry) => {
            entry.influences[entry.index] = on ? 1 : 0;
          });
          buttons.get(name)?.setAttribute("aria-pressed", String(on));
        };
        shapePanel.hidden = false;
        shapePicker.replaceChildren(
          ...names.map((name) => {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "model-chip";
            button.textContent = name;
            button.setAttribute("aria-pressed", "false");
            button.addEventListener("click", () => {
              const turningOn = button.getAttribute("aria-pressed") !== "true";
              if (isMouth(name) && turningOn) {
                names.forEach((other) => {
                  if (isMouth(other) && other !== name) setShape(other, false);
                });
              }
              setShape(name, turningOn);
              sceneOf(viewer)?.queueRender?.();
              shapePanel.open = false;
            });
            buttons.set(name, button);
            return button;
          })
        );
      };

      const showAnimations = () => {
        const names = sortAnimations((viewer.availableAnimations || []).filter((name) => !isTPose(name)));
        if (!names.length) {
          animationPicker.replaceChildren();
          animPanel.hidden = true;
          hideTransport();
          return;
        }
        animPanel.hidden = false;
        const next = (monstersActive() && names.find((name) => isMove(name)))
          || names.find((name) => isIdle(name))
          || names[0];
        renderChips(
          animationPicker,
          names.map((name) => ({ name, label: animationLabel(name) })),
          animationLabel(next),
          (item) => {
            playAnimation(item.name, true);
            animPanel.open = false;
          }
        );
        playAnimation(next, false);
        syncTransport();
      };

      let scrubbing = false;
      let resumeAfterScrub = false;

      const clipDuration = () => {
        const duration = Number(viewer.duration);
        return Number.isFinite(duration) && duration > 0 ? duration : 0;
      };

      const hideTransport = () => {
        animTransport.hidden = true;
      };

      const syncTransport = () => {
        const names = (viewer.availableAnimations || []).filter((name) => !isTPose(name));
        if (!names.length || !viewer.animationName) {
          hideTransport();
          return;
        }
        animTransport.hidden = false;
        const playing = !viewer.paused;
        animPlay.setAttribute("aria-pressed", String(playing));
        animPause.setAttribute("aria-pressed", String(!playing));
        const duration = clipDuration();
        if (!duration) return;
        animTime.max = String(duration);
        if (!scrubbing) animTime.value = String(Math.min(Math.max(viewer.currentTime || 0, 0), duration));
      };

      const beginScrub = () => {
        if (scrubbing) return;
        scrubbing = true;
        resumeAfterScrub = !viewer.paused;
        viewer.pause();
      };

      const seekAnimation = () => {
        const duration = clipDuration();
        if (!duration) return;
        viewer.currentTime = Math.min(Math.max(Number(animTime.value) || 0, 0), duration);
        sceneOf(viewer)?.queueRender?.();
      };

      const endScrub = () => {
        if (!scrubbing) return;
        seekAnimation();
        scrubbing = false;
        if (resumeAfterScrub) viewer.play();
        syncTransport();
      };

      const stopAnimation = () => {
        scrubbing = false;
        viewer.pause();
        viewer.currentTime = 0;
        sceneOf(viewer)?.queueRender?.();
        syncTransport();
      };

      const selectProject = (index) => {
        if (!projects[index] || index === activeProject) return;
        activeProject = index;
        activeGroup = 0;
        activeModel = -1;
        renderMenus();
        selectModel(0);
      };

      const selectGroup = (index) => {
        if (!currentProject().groups[index] || index === activeGroup) return;
        activeGroup = index;
        activeModel = -1;
        renderMenus();
        selectModel(0);
      };

      const selectModel = (index) => {
        const model = currentModels()[index];
        if (!model || !viewer) {
          renderThumbs("");
          return;
        }
        if (index === activeModel && modelPicker.childElementCount) return;
        activeModel = index;
        activeAnimation = null;
        animationChosen = false;
        renderMenus();
        renderThumbs(model.name);
        viewer.alt = model.alt;
        const token = ++requestId;
        userZoomed = false;
        modelView.classList.add("is-loading");
        const reveal = async () => {
          if (token !== requestId) return;
          try {
            await settlePose(token);
            if (token !== requestId) return;
            await frameModel(token);
            if (token !== requestId) return;
            keepGroundAtOrigin();
            await new Promise((resolve) => requestAnimationFrame(resolve));
            await new Promise((resolve) => requestAnimationFrame(resolve));
          } finally {
            if (token === requestId) modelView.classList.remove("is-loading");
          }
        };
        if (viewer.src === absoluteUrl(model.src) && viewer.loaded) {
          reveal();
          return;
        }
        animationPicker.replaceChildren();
        animPanel.hidden = true;
        hideShapes();
        hideTransport();
        viewer.addEventListener("load", reveal, { once: true });
        viewer.src = model.src;
      };

      if (viewer && projectPicker && groupPicker && modelPicker && animationPicker && shapePicker && animTransport) {
        viewer.addEventListener("camera-change", (event) => {
          if (event.detail?.source !== "user-interaction" || framedRadius == null) return;
          const radius = viewer.getCameraOrbit().radius;
          if (Math.abs(radius - framedRadius) / framedRadius > 0.02) userZoomed = true;
        });
        window.addEventListener("resize", () => {
          if (!userZoomed && viewer.loaded) frameModel(requestId);
        });
        viewer.addEventListener("error", () => {
          animationPicker.replaceChildren();
          animPanel.hidden = true;
          hideShapes();
          hideTransport();
          modelView.classList.remove("is-loading");
        });
        animPlay.addEventListener("click", () => {
          if (!viewer.animationName) return;
          scrubbing = false;
          viewer.play();
          syncTransport();
        });
        animPause.addEventListener("click", () => {
          if (!viewer.animationName) return;
          scrubbing = false;
          viewer.pause();
          syncTransport();
        });
        animStop.addEventListener("click", stopAnimation);
        animTime.addEventListener("pointerdown", beginScrub);
        animTime.addEventListener("input", () => {
          beginScrub();
          seekAnimation();
        });
        animTime.addEventListener("change", endScrub);
        animTime.addEventListener("pointerup", endScrub);
        animTime.addEventListener("pointercancel", endScrub);
        const followAnimation = () => {
          if (!scrubbing) syncTransport();
          requestAnimationFrame(followAnimation);
        };
        followAnimation();
        selectModel(0);
      }
    </script>
    <script>
      const root = document.documentElement;

      const syncPageWidth = () => {
        root.style.setProperty("--page-width", `${root.clientWidth}px`);
      };
      syncPageWidth();
      if ("ResizeObserver" in window) {
        new ResizeObserver(syncPageWidth).observe(root);
      } else {
        window.addEventListener("resize", syncPageWidth);
      }

      const button = document.getElementById("themeToggle");
      const themeIcon = document.getElementById("themeIcon");
      const systemPrefersLight = window.matchMedia("(prefers-color-scheme: light)");

      const readStoredTheme = () => {
        try {
          return localStorage.getItem("theme");
        } catch (error) {
          return null;
        }
      };

      const syncThemeIcon = (theme) => {
        const isLight = theme === "light";
        themeIcon.classList.toggle("fa-sun", isLight);
        themeIcon.classList.toggle("fa-moon", !isLight);
        button.setAttribute("aria-checked", String(isLight));
        button.setAttribute("aria-label", isLight ? "Use dark theme" : "Use light theme");
      };

      const getPreferredTheme = () => readStoredTheme() || (systemPrefersLight.matches ? "light" : "dark");

      const applyTheme = (theme) => {
        if (theme === "light") {
          root.setAttribute("data-theme", "light");
        } else {
          root.removeAttribute("data-theme");
        }
        syncThemeIcon(theme);
      };

      applyTheme(getPreferredTheme());

      button.addEventListener("click", () => {
        const current = root.getAttribute("data-theme") === "light" ? "light" : "dark";
        const next = current === "light" ? "dark" : "light";
        applyTheme(next);
        try {
          localStorage.setItem("theme", next);
        } catch (error) {}
      });

      systemPrefersLight.addEventListener("change", () => {
        if (!readStoredTheme()) {
          applyTheme(systemPrefersLight.matches ? "light" : "dark");
        }
      });

      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
